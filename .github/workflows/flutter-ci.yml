name: Flutter CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.2'
          channel: stable
          cache: true
      - run: flutter create --platforms=android,ios,web --org com.glendeweerdt --project-name dart_app .
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed lib
      - run: flutter analyze
      - run: flutter test
      - run: flutter build appbundle --release
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: dartapp-android-aab
          path: build/app/outputs/bundle/release/app-release.aab
      - uses: actions/upload-artifact@v4
        with:
          name: dartapp-android-apk
          path: build/app/outputs/flutter-apk/app-release.apk

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.2'
          channel: stable
          cache: true
      - run: flutter create --platforms=android,ios,web --org com.glendeweerdt --project-name dart_app .
      - run: flutter pub get
      - run: flutter build web --release
      - uses: actions/upload-artifact@v4
        with:
          name: dartapp-web
          path: build/web

  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.2'
          channel: stable
          cache: true
      - run: flutter create --platforms=ios --org com.glendeweerdt --project-name dart_app .
      - run: flutter pub get
      - run: flutter build ios --release --no-codesign
      - run: mkdir -p build/ios-artifact && cp -R build/ios/iphoneos/Runner.app build/ios-artifact/Runner.app
      - uses: actions/upload-artifact@v4
        with:
          name: dartapp-ios-unsigned
          path: build/ios-artifact
